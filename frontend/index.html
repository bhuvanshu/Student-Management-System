<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
</head>
<body>

<h1>Student Management System</h1>

<h2>Add Student</h2>
<form id="studentForm">
    <label>Name:</label>
    <input type="text" id="name" placeholder="Enter student name" required>
    <br><br>
    
    <label>Email:</label>
    <input type="email" id="email" placeholder="Enter student email" required>
    <br><br>
    
    <label>Course:</label>
    <input type="text" id="course" placeholder="Enter student course" required>
    <br><br>
    
    <button type="submit">Add Student</button>
</form>

<p id="message"></p>

<button id="getAllBtn">Get All Students</button>

<h2 id="studentListHeading" style="display:none;">Student List</h2>
<table id="studentTable" border="1" style="margin-top: 20px; width: 100%; display:none;">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="studentTableBody">
    </tbody>
</table>

<h2 id="editHeading" style="display:none;">Edit Student</h2>
<form id="editForm" style="display:none;">
    <label>Name:</label>
    <input type="text" id="editName" required>
    <br><br>
    
    <label>Email:</label>
    <input type="email" id="editEmail" required>
    <br><br>
    
    <label>Course:</label>
    <input type="text" id="editCourse" required>
    <br><br>
    
    <button type="submit">Update Student</button>
    <button type="button" id="cancelEdit">Cancel</button>
</form>

<script src="script.js"></script>

</body>
</html>
